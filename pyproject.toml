[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".local-docs", ".agents", ".codex", "captures", "sessions", "traces"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Standalone tests add their adjacent scripts directory before importing helpers.
"tests/test_*.py" = ["E402"]
"skills/*/tests/test_*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
